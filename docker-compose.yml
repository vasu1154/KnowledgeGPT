services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: knowledgegpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jd
      POSTGRES_DB: knowledgegpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis (for Celery — Phase 7)
  redis:
    image: redis:7-alpine
    container_name: knowledgegpt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
